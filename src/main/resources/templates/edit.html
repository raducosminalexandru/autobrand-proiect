<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editare Produs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
        }

        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }

        form { display: flex; flex-direction: column; gap: 1.2rem; }

        .field-group { display: flex; flex-direction: column; gap: 0.5rem; }

        label { font-size: 0.875rem; font-weight: 600; color: var(--text-muted); }

        input {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            transition: border 0.2s;
        }

        input:focus { outline: none; border-color: var(--primary); ring: 2px solid #e0e7ff; }

        .readonly-field { background-color: #f3f4f6; cursor: not-allowed; }

        .actions { display: flex; gap: 10px; margin-top: 1rem; }

        button {
            flex: 2;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }

        .cancel-btn {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            text-decoration: none;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Editare Produs</h1>

    <form th:action="@{/update}" th:object="${produs}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="field-group">
            <label>Nume Produs</label>
            <input type="text" th:field="*{nume}" />
        </div>

        <div class="field-group">
            <label>Preț (EUR)</label>
            <input type="number" step="0.01" th:field="*{pretEur}" id="pretEur" />
        </div>

        <div class="field-group">
            <label>Preț (RON)</label>
            <input type="number" step="0.01" th:field="*{pretRon}" id="pretRon" />
        </div>

        <div class="field-group">
            <label>Curs valutar (EUR/RON)</label>
            <input type="number" step="0.0001" th:field="*{cursValutar}" id="cursValutar" readonly class="readonly-field" />
        </div>

        <div class="actions">
            <button type="submit">Salvează</button>
            <a href="/" class="cancel-btn">Anulează</a>
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const pretEurInput = document.getElementById('pretEur');
        const pretRonInput = document.getElementById('pretRon');
        const cursValutarInput = document.getElementById('cursValutar');

        if (pretEurInput && pretRonInput && cursValutarInput) {
            const curs = parseFloat(cursValutarInput.value);
            if (!isNaN(curs) && curs > 0) {
                pretEurInput.addEventListener('input', () => {
                    const val = parseFloat(pretEurInput.value);
                    pretRonInput.value = !isNaN(val) ? (val * curs).toFixed(2) : '';
                });
                pretRonInput.addEventListener('input', () => {
                    const val = parseFloat(pretRonInput.value);
                    pretEurInput.value = !isNaN(val) ? (val / curs).toFixed(2) : '';
                });
            }
        }
    });
</script>
</body>
</html>
