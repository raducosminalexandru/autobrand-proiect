<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Autentificare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
        form { display: flex; flex-direction: column; gap: 1.2rem; }
        .field-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.875rem; font-weight: 600; color: var(--text-muted); }
        input { padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
        .btn {
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            margin-top: 0.5rem;
        }
        .btn-secondary:hover { background-color: #f5f3ff; }
        .alert { padding: 0.75rem; background-color: #fee2e2; color: #ef4444; border-radius: 6px; font-size: 0.9rem; text-align: center; }
        .alert-success { background-color: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Autentificare</h1>

    <div class="alert" th:if="${param.error}">Username sau parolă incorectă!</div>
    <div class="alert alert-success" th:if="${param.logout}">Te-ai deconectat cu succes.</div>
    <div class="alert alert-success" th:if="${param.registered}">Cont creat! Acum te poți loga.</div>

    <form th:action="@{/login}" method="post">
        <div class="field-group">
            <label>Username</label>
            <input type="text" name="username" required autocomplete="username" />
        </div>

        <div class="field-group">
            <label>Parolă</label>
            <input type="password" name="password" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn">Intră în cont</button>
        <a href="/register" class="btn btn-secondary">Creare cont nou</a>
    </form>
</div>

</body>
</html>
