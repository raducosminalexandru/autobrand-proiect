<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Creare Cont</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
        form { display: flex; flex-direction: column; gap: 1.2rem; }
        .field-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.875rem; font-weight: 600; color: var(--text-muted); }
        input { padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
        .btn {
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .cancel-link { text-align: center; font-size: 0.9rem; color: #6b7280; text-decoration: none; margin-top: 0.5rem; }
        .cancel-link:hover { color: #111827; }
        .alert { padding: 0.75rem; background-color: #fee2e2; color: #ef4444; border-radius: 6px; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Înregistrare Cont</h1>

    <div class="alert" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <div class="field-group">
            <label>Alege un Username</label>
            <input type="text" name="username" required />
        </div>

        <div class="field-group">
            <label>Parolă</label>
            <input type="password" name="password" required />
        </div>

        <div class="field-group">
            <label>Retastează Parola</label>
            <input type="password" name="confirmPassword" required />
        </div>

        <button type="submit" class="btn">Creează Contul</button>
        <a href="/login" class="cancel-link">Înapoi la Login</a>
    </form>
</div>

</body>
</html>
